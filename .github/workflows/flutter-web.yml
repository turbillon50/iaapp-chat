name: IA.app CHAT — Flutter web build
on:
  push:
    branches: [main, work/fluffychat-upstream]
    paths: [client/**, .github/workflows/flutter-web.yml]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  web:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Flutter version
        run: flutter --version
      - name: Resolve packages
        working-directory: client
        run: flutter pub get
      - name: Verify pinned E2EE and image runtime assets
        run: sha256sum -c client/RUNTIME_ASSETS.sha256
      - name: Build actual Flutter web app
        working-directory: client
        run: flutter build web --release --base-href /
      - name: Verify output
        run: test -f client/build/web/index.html && test -f client/build/web/flutter_bootstrap.js && test -s client/build/web/Imaging.js && test -s client/build/web/assets/assets/vodozemac/0.8.1/vodozemac_bindings_dart.js
      - uses: actions/upload-artifact@v4
        with:
          name: iaapp-chat-flutter-web
          path: client/build/web/
          if-no-files-found: error
          retention-days: 7
